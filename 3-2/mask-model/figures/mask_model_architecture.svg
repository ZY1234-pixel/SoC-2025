<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #172033; }
      .title { font-size: 46px; font-weight: 700; }
      .heading { font-size: 25px; font-weight: 700; }
      .label { font-size: 19px; font-weight: 600; }
      .body { font-size: 17px; fill: #475467; }
      .small { font-size: 15px; fill: #667085; }
      .white { fill: #ffffff; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
    <marker id="arrowGray" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#98a2b3"/></marker>
  </defs>

  <rect width="1920" height="1080" fill="#ffffff"/>
  <text x="60" y="78" class="title">轻量级水印 Mask 模型</text>
  <text x="60" y="116" class="body">MobileNetV3-Large 编码器 · 多尺度特征融合 · 高分辨率细节分支</text>
  <line x1="60" y1="145" x2="1860" y2="145" stroke="#d0d5dd"/>

  <!-- Input -->
  <text x="125" y="245" text-anchor="middle" class="heading">输入</text>
  <rect x="60" y="285" width="130" height="130" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="125" y="340" text-anchor="middle" class="label">RGB 图像</text>
  <text x="125" y="375" text-anchor="middle" class="body">3 × H × W</text>
  <line x1="190" y1="350" x2="260" y2="350" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Encoder -->
  <text x="545" y="220" text-anchor="middle" class="heading">MobileNetV3-Large 编码器</text>
  <text x="545" y="250" text-anchor="middle" class="small">ImageNet 预训练</text>
  <g>
    <rect x="280" y="285" width="105" height="130" fill="#edf4ff" stroke="#8ab4f8"/>
    <text x="332" y="330" text-anchor="middle" class="label">C1</text>
    <text x="332" y="360" text-anchor="middle" class="body">16 ch</text>
    <text x="332" y="389" text-anchor="middle" class="small">H/2</text>

    <rect x="400" y="295" width="105" height="120" fill="#e5efff" stroke="#76a7f7"/>
    <text x="452" y="335" text-anchor="middle" class="label">C2</text>
    <text x="452" y="365" text-anchor="middle" class="body">24 ch</text>
    <text x="452" y="394" text-anchor="middle" class="small">H/4</text>

    <rect x="520" y="305" width="105" height="110" fill="#dceaff" stroke="#5f97ef"/>
    <text x="572" y="340" text-anchor="middle" class="label">C3</text>
    <text x="572" y="370" text-anchor="middle" class="body">40 ch</text>
    <text x="572" y="399" text-anchor="middle" class="small">H/8</text>

    <rect x="640" y="315" width="105" height="100" fill="#d2e4ff" stroke="#4786e7"/>
    <text x="692" y="345" text-anchor="middle" class="label">C4</text>
    <text x="692" y="375" text-anchor="middle" class="body">112 ch</text>
    <text x="692" y="404" text-anchor="middle" class="small">H/16</text>

    <rect x="760" y="325" width="115" height="90" fill="#c7dcff" stroke="#2563eb"/>
    <text x="817" y="352" text-anchor="middle" class="label">C5</text>
    <text x="817" y="380" text-anchor="middle" class="body">960 ch</text>
    <text x="817" y="406" text-anchor="middle" class="small">H/32</text>
  </g>
  <line x1="385" y1="350" x2="400" y2="350" stroke="#98a2b3" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="505" y1="350" x2="520" y2="350" stroke="#98a2b3" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="625" y1="350" x2="640" y2="350" stroke="#98a2b3" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="745" y1="350" x2="760" y2="350" stroke="#98a2b3" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- FPN -->
  <text x="1120" y="220" text-anchor="middle" class="heading">特征金字塔 FPN</text>
  <text x="1120" y="250" text-anchor="middle" class="small">1×1 Conv 统一为 64 通道，自顶向下融合</text>
  <g>
    <rect x="920" y="325" width="115" height="90" fill="#2563eb"/>
    <text x="977" y="357" text-anchor="middle" class="label white">P5</text>
    <text x="977" y="386" text-anchor="middle" class="small" style="fill:#ffffff">64 · H/32</text>

    <rect x="1050" y="315" width="115" height="100" fill="#2563eb"/>
    <text x="1107" y="350" text-anchor="middle" class="label white">P4</text>
    <text x="1107" y="381" text-anchor="middle" class="small" style="fill:#ffffff">64 · H/16</text>

    <rect x="1180" y="305" width="115" height="110" fill="#2563eb"/>
    <text x="1237" y="345" text-anchor="middle" class="label white">P3</text>
    <text x="1237" y="377" text-anchor="middle" class="small" style="fill:#ffffff">64 · H/8</text>

    <rect x="1310" y="295" width="115" height="120" fill="#2563eb"/>
    <text x="1367" y="339" text-anchor="middle" class="label white">P2</text>
    <text x="1367" y="371" text-anchor="middle" class="small" style="fill:#ffffff">64 · H/4</text>

    <rect x="1440" y="285" width="115" height="130" fill="#2563eb"/>
    <text x="1497" y="333" text-anchor="middle" class="label white">P1</text>
    <text x="1497" y="365" text-anchor="middle" class="small" style="fill:#ffffff">64 · H/2</text>
  </g>
  <line x1="875" y1="370" x2="920" y2="370" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1035" y1="370" x2="1050" y2="370" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1165" y1="370" x2="1180" y2="370" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1295" y1="370" x2="1310" y2="370" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1425" y1="370" x2="1440" y2="370" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- lateral connections -->
  <g fill="none" stroke="#98a2b3" stroke-width="1.8" stroke-dasharray="6 6">
    <path d="M332 415 V475 H1497 V415"/>
    <path d="M452 415 V460 H1367 V415"/>
    <path d="M572 415 V445 H1237 V415"/>
    <path d="M692 415 V430 H1107 V415"/>
  </g>
  <text x="1030" y="503" text-anchor="middle" class="small">横向连接：对应尺度特征相加后使用深度可分离卷积平滑</text>

  <!-- Detail branch -->
  <path d="M125 415 V650 H300" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="485" y="590" text-anchor="middle" class="heading">高分辨率细节分支</text>
  <rect x="320" y="625" width="330" height="100" fill="#f8fafc" stroke="#98a2b3"/>
  <text x="485" y="665" text-anchor="middle" class="label">3×3 Conv, stride 2 + Smooth</text>
  <text x="485" y="699" text-anchor="middle" class="body">24 通道 · H/2 × W/2</text>
  <text x="485" y="755" text-anchor="middle" class="small">保留细小文字笔画与局部边缘</text>

  <!-- Fusion and head -->
  <path d="M650 675 H820" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1497 415 V555 H985 V625" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="840" y="625" width="290" height="100" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="985" y="665" text-anchor="middle" class="label">特征拼接与融合</text>
  <text x="985" y="699" text-anchor="middle" class="body">(64 + 24) → 64 通道</text>

  <line x1="1130" y1="675" x2="1245" y2="675" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1265" y="625" width="230" height="100" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="1380" y="665" text-anchor="middle" class="label">Mask Head</text>
  <text x="1380" y="699" text-anchor="middle" class="body">Smooth + 1×1 Conv</text>

  <line x1="1495" y1="675" x2="1580" y2="675" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1600" y="610" width="260" height="130" fill="#2563eb"/>
  <text x="1730" y="653" text-anchor="middle" class="label white">双线性上采样</text>
  <text x="1730" y="685" text-anchor="middle" class="body" style="fill:#ffffff">恢复至 H × W</text>
  <text x="1730" y="719" text-anchor="middle" class="label white">单通道 Mask</text>

  <!-- Auxiliary supervision -->
  <rect x="830" y="790" width="400" height="95" fill="#ffffff" stroke="#98a2b3" stroke-dasharray="7 6"/>
  <text x="1030" y="827" text-anchor="middle" class="label">辅助 Mask Head × 2</text>
  <text x="1030" y="859" text-anchor="middle" class="small">P2、P1 训练期辅助监督；推理阶段移除</text>

  <line x1="60" y1="950" x2="1860" y2="950" stroke="#d0d5dd"/>
  <text x="60" y="1000" class="body">参数量 3.083M　·　FP32 权重约 11.76 MiB　·　任意输入分辨率</text>
  <text x="1860" y="1000" text-anchor="end" class="body">输出：水印像素概率图</text>
</svg>
